<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./public/CSS/mai.css">
    <title>Buscador de Palabras</title>
</head>
<body>
    <div class="container">
        <header class="main-header">
            <h1><i class="fa-solid fa-magnifying-glass"></i> Buscador de Palabras</h1>
        </header>
        <div class="card">
            <div class="row-inputs">
                <div class="col-main form-group">
                    <label for="textoALeer">Ingrese el texto</label>
                    <textarea id="textoALeer" placeholder="Coloque texto..."></textarea>
                </div>

                <div class="col-side form-group">
                    <label for="PalabraABuscar">Ingrese la palabra a buscar</label>
                    <input type="text" placeholder="Palabra" id="PalabraABuscar">
                </div>
            </div>

            <div class="btn-container">
                <button id="btnBuscar"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
                <button id="btnLimpiar"><i class="fa-solid fa-broom"></i> Limpiar</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <i class="fa-solid fa-calculator"></i> Resultados
            </div>
            <div class="result-box">
                <span>Veces encontrado:</span>
                <span id="contador">0</span>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label>Texto con coincidencias resaltadas:</label>
                <div id="textoResaltado">...</div>
            </div>
        </div>
    </div>
   
    <script src="./bundle.js"></script>
</body>
</html>
